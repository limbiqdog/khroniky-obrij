<!doctype html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Штаб ОБРІЮ</title><meta name="robots" content="noindex">
<style>
:root{--bg:#f6f3ec;--fg:#2b2620;--mut:#7a6f62;--card:#fffdf8;--line:#e3dccf;--acc:#6b3fa0;--ok:#2f7d4f;--red:#b2412f}
@media (prefers-color-scheme:dark){:root{--bg:#17141c;--fg:#ece6dc;--mut:#a39a8e;--card:#211d27;--line:#342e3c;--acc:#c49bff;--ok:#7fd1a0;--red:#ff9a86}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.15rem;margin:0 0 .6em}
h2 small,.hint{color:var(--mut);font-weight:400;font-size:.85rem}h4{margin:1em 0 .3em;color:var(--acc);font-size:.95rem}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px}.tile span{display:block;color:var(--mut);font-size:.8rem}
.tile b{font-size:1.15rem}.tile i{display:block;color:var(--mut);font-size:.75rem;font-style:normal}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin:3px;font-size:.9rem}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.red{border-color:var(--red);color:var(--red)}
ul{padding-left:1.2em;margin:.3em 0}li{margin:.2em 0}.ach{list-style:none;padding:0}.ach .d{color:var(--mut);font-size:.85rem;min-width:7em;display:inline-block}
details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-weight:600}.md p{margin:.3em 0}
#lock{max-width:360px;margin:20vh auto;text-align:center}#lock input,#lock button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);width:100%;margin:6px 0;background:var(--card);color:var(--fg)}
#lock button{background:var(--acc);color:#fff;border:0}#err{color:var(--red);min-height:1.5em}
footer{color:var(--mut);font-size:.8rem;text-align:center;margin:20px 0}
</style></head><body>
<div id="lock"><h1>Штаб ОБРІЮ</h1><p class="hint">сторінка під паролем</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="пароль"><button id="go">Відкрити</button><div id="err"></div></div>
<main id="app" hidden></main>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){const r=b(P),salt=r.slice(0,16),iv=r.slice(16,28),ct=r.slice(28);
const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:IT,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);return new TextDecoder().decode(pt)}
async function go(pw,quiet){try{const h=await open(pw);document.getElementById("app").innerHTML=h;document.getElementById("app").hidden=false;
document.getElementById("lock").hidden=true;try{localStorage.setItem("shtab-pw",pw)}catch(e){}}
catch(e){if(!quiet)document.getElementById("err").textContent="Не той пароль";try{if(quiet)localStorage.removeItem("shtab-pw")}catch(_){}}}
document.getElementById("go").onclick=()=>go(document.getElementById("pw").value);
document.getElementById("pw").onkeydown=ev=>{if(ev.key==="Enter")go(ev.target.value)};
try{const s=localStorage.getItem("shtab-pw");if(s)go(s,true)}catch(e){}
